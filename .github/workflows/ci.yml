name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vite+ のセットアップ
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
      - name: 依存関係のインストール
        run: vp install
      - name: フォーマット・Lint・型チェック
        run: vp check
      - name: テスト
        run: vp test
      - name: ビルド
        run: vp run build
